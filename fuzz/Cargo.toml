[package]
name = "ass-fonts-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
ass-fonts = { path = ".." }

[[bin]]
name = "subtitle"
path = "fuzz_targets/subtitle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolver"
path = "fuzz_targets/resolver.rs"
test = false
doc = false
bench = false
