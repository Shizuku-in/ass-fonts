[package]
name = "ass-fonts"
version = "0.2.2"
edition = "2024"
rust-version = "1.87"
description = "Analyze and resolve font dependencies in ASS/SSA subtitles."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Shizuku-in/ass-fonts"
keywords = ["ass", "ssa", "subtitles", "fonts"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/benches/**/*.rs",
    "/examples/report.rs",
    "/examples/sample.ass",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README-zh.md",
    "/CHANGELOG.md",
    "/FUZZING.md",
    "/RELEASING.md",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
ttf-parser = "0.25.1"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
tempfile = "3"

[[bench]]
name = "pipeline"
harness = false
