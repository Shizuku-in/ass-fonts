name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Sanitizer fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz subtitle extraction
        run: cargo +nightly fuzz run subtitle -- -max_total_time=30 -timeout=10
      - name: Fuzz font resolution
        run: cargo +nightly fuzz run resolver -- -max_total_time=30 -timeout=10
