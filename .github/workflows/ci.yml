name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: '1.87.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test library, integration tests, and examples
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Test documentation examples
        run: cargo +${{ matrix.rust }} test --locked --doc
      - name: Test with all features
        run: cargo +${{ matrix.rust }} test --locked --all-targets --all-features
      - name: Test without default features
        run: cargo +${{ matrix.rust }} test --locked --all-targets --no-default-features

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +stable clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Compile performance benchmarks
        run: cargo +stable bench --locked --bench pipeline --no-run
      - name: Compile fuzz targets
        run: cargo +stable check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Check fuzz target formatting
        run: cargo +stable fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Lint fuzz targets
        run: cargo +stable clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Check public API documentation
        run: cargo +stable doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and audit release archive
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable package --locked
          files=$(cargo +stable package --locked --list)
          allowed='^(Cargo\.(toml|toml\.orig|lock)|\.cargo_vcs_info\.json|LICENSE|README(-zh)?\.md|CHANGELOG\.md|FUZZING\.md|examples/(report\.rs|sample\.ass)|(src|tests|benches)/.+\.rs)$'
          if unexpected=$(grep -vE "$allowed" <<<"$files"); then
            echo "Unexpected packaged files:"; echo "$unexpected"; exit 1
          fi
          for file in Cargo.toml Cargo.lock LICENSE README.md README-zh.md CHANGELOG.md FUZZING.md \
              src/lib.rs src/coverage.rs src/subtitle.rs src/syntax.rs src/rewrite.rs src/encoding.rs \
              src/fonts/mod.rs src/fonts/index.rs src/fonts/resolve.rs src/fonts/scan.rs \
              tests/support/font.rs benches/pipeline.rs examples/report.rs examples/sample.ass; do
            grep -qxF "$file" <<<"$files" || { echo "Missing release file: $file"; exit 1; }
          done
          id=$(cargo +stable pkgid)
          crate="target/package/ass-fonts-${id##*[#@]}.crate"
          compressed=$(stat -c %s "$crate")
          uncompressed=$(tar -xzOf "$crate" | wc -c)
          if [ "$compressed" -gt 524288 ] || [ "$uncompressed" -gt 1048576 ]; then
            echo "Package exceeded the source-only size budget; inspect its contents"; exit 1
          fi
          echo "Verified $crate: $(wc -l <<<"$files") files, $uncompressed bytes uncompressed, $compressed bytes compressed"
