name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: '1.87.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test library, integration tests, and examples
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: Test documentation examples
        run: cargo +${{ matrix.rust }} test --locked --doc

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Compile performance benchmarks
        run: cargo +stable bench --locked --bench pipeline --no-run
      - name: Compile fuzz targets
        run: cargo +stable check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Check fuzz target formatting
        run: cargo +stable fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Lint fuzz targets
        run: cargo +stable clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Check public API documentation
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build and audit release archive
        run: python3 scripts/check-package.py
        env:
          RUSTUP_TOOLCHAIN: stable
